<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 420" width="100%" height="100%">
  <defs>
    <!-- Gradiente calotta parapendio -->
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="35%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="canopyHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Parapendio calotta superiore -->
    <g id="paraglider-wing">
      <path d="M 64 165 C 105 35, 407 35, 448 165 C 385 110, 127 110, 64 165 Z" fill="url(#canopyGrad)" stroke="#0f172a" stroke-width="9" stroke-linejoin="round" />
      <!-- Bordo di attacco / riflesso -->
      <path d="M 90 140 C 130 65, 382 65, 422 140 C 370 95, 142 95, 90 140 Z" fill="url(#canopyHighlight)" opacity="0.75" />
      <!-- Bordo inferiore nero calotta -->
      <path d="M 72 162 C 135 118, 377 118, 440 162" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Fascio funi del parapendio -->
    <g id="lines" stroke="#0f172a" stroke-width="5" stroke-linecap="round">
      <line x1="120" y1="125" x2="205" y2="270" />
      <line x1="165" y1="105" x2="210" y2="270" />
      <line x1="347" y1="105" x2="302" y2="270" />
      <line x1="392" y1="125" x2="307" y2="270" />
    </g>

    <!-- Personaggio Coniglio -->
    <g id="bunny">
      <!-- Cinghie imbrago arancione -->
      <path d="M 202 275 Q 198 320 208 355" stroke="#ea580c" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M 310 275 Q 314 320 304 355" stroke="#ea580c" stroke-width="12" stroke-linecap="round" fill="none" />

      <!-- Orecchio Sinistro -->
      <path d="M 206 215 C 180 170, 200 128, 226 146 C 246 164, 242 205, 230 228 Z" fill="#ffffff" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />
      <path d="M 210 205 C 196 174, 208 145, 224 156 C 234 168, 234 198, 224 212 Z" fill="#fca5a5" />

      <!-- Orecchio Destro -->
      <path d="M 306 215 C 332 170, 312 128, 286 146 C 266 164, 270 205, 282 228 Z" fill="#ffffff" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />
      <path d="M 302 205 C 316 174, 304 145, 288 156 C 278 168, 278 198, 288 212 Z" fill="#fca5a5" />

      <!-- Coda pelosa -->
      <circle cx="305" cy="340" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="7" />

      <!-- Corpo del coniglietto -->
      <ellipse cx="256" cy="320" rx="46" ry="44" fill="#ffffff" stroke="#0f172a" stroke-width="8" />

      <!-- Testa rotonda -->
      <ellipse cx="256" cy="245" rx="54" ry="46" fill="#ffffff" stroke="#0f172a" stroke-width="8" />

      <!-- Occhi neri e riflessi grandi -->
      <ellipse cx="232" cy="236" rx="8" ry="11" fill="#0f172a" />
      <circle cx="230" cy="232" r="3.2" fill="#ffffff" />

      <ellipse cx="280" cy="236" rx="8" ry="11" fill="#0f172a" />
      <circle cx="278" cy="232" r="3.2" fill="#ffffff" />

      <!-- Guancette rosa -->
      <ellipse cx="218" cy="252" rx="8" ry="5.5" fill="#fca5a5" opacity="0.85" />
      <ellipse cx="294" cy="252" rx="8" ry="5.5" fill="#fca5a5" opacity="0.85" />

      <!-- Nasino e Bocca felice -->
      <path d="M 251 248 Q 256 244 261 248 Z" fill="#0f172a" />
      <path d="M 244 256 Q 256 276 268 256 Z" fill="#991b1b" stroke="#0f172a" stroke-width="4" />
      <path d="M 250 266 Q 256 271 262 266" fill="#f87171" />

      <!-- Manine sulle cinghie -->
      <circle cx="190" cy="280" r="15" fill="#ffffff" stroke="#0f172a" stroke-width="7" />
      <circle cx="322" cy="280" r="15" fill="#ffffff" stroke="#0f172a" stroke-width="7" />

      <!-- Zampette inferiori con polpastrelli rosa -->
      <g id="left-foot">
        <ellipse cx="225" cy="355" rx="19" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="7" />
        <ellipse cx="225" cy="361" rx="8.5" ry="11" fill="#fca5a5" />
        <circle cx="216" cy="344" r="3.2" fill="#fca5a5" />
        <circle cx="225" cy="342" r="3.2" fill="#fca5a5" />
        <circle cx="234" cy="344" r="3.2" fill="#fca5a5" />
      </g>

      <g id="right-foot">
        <ellipse cx="287" cy="355" rx="19" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="7" />
        <ellipse cx="287" cy="361" rx="8.5" ry="11" fill="#fca5a5" />
        <circle cx="278" cy="344" r="3.2" fill="#fca5a5" />
        <circle cx="287" cy="342" r="3.2" fill="#fca5a5" />
        <circle cx="296" cy="344" r="3.2" fill="#fca5a5" />
      </g>
    </g>
  </g>
</svg>