name: Gemini CLI Assistant

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gemini:
    if: >-
      github.event.sender.type == 'User' &&
      !endsWith(github.event.comment.user.login || github.event.issue.user.login, '[bot]') &&
      contains(github.event.comment.body || github.event.issue.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Gemini CLI
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |-
            Sei un assistente di sviluppo nel repository ${{ github.repository }}
            (app meteo per parapendio: Next.js, TypeScript, CesiumJS, cartina 3D, windgram).
            Rispondi sempre in italiano, in modo pratico e concreto.
            L'utente ha scritto questo messaggio nella issue #${{ github.event.issue.number }}:
            """
            ${{ github.event.comment.body || github.event.issue.body }}
            """
            Analizza il codice del repository quando serve e rispondi con:
            spiegazioni chiare, correzioni proposte, snippet di codice pronti all'uso.

      - name: Post reply as comment
        if: ${{ steps.gemini.outputs.summary != '' }}
        uses: actions/github-script@v7
        env:
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '🤖 **Gemini CLI**\n\n' + process.env.GEMINI_SUMMARY
            });
