name: AI Assistant (gratis)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai:
    if: >-
      github.event.sender.type == 'User' &&
      !endsWith(github.event.comment.user.login || github.event.issue.user.login, '[bot]') &&
      contains(github.event.comment.body || github.event.issue.body, '@ai')
    runs-on: ubuntu-latest
    steps:
      - name: Chiedi a Gemini (REST diretto)
        id: ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_MSG: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          msg = os.environ.get("USER_MSG", "")
          num = os.environ.get("ISSUE_NUM", "?")
          payload = {
            "systemInstruction": {"parts": [{"text": "Sei un assistente di sviluppo senior nel repository la-meteo-dei-conigli (app meteo per parapendio: Next.js, TypeScript, CesiumJS, cartina 3D, windgram). Rispondi sempre in italiano, in modo pratico, concreto e senza giri di parole. Se il messaggio e' solo il richiamo '@ai' senza una richiesta precisa, saluta e chiedi di cosa ha bisogno, proponendo 3 esempi di richieste utili per questa app."}]},
            "contents": [{"role": "user", "parts": [{"text": "Messaggio dell'utente nella issue #" + num + ":\n\"\"\"\n" + msg + "\n\"\"\"\nRispondi alla richiesta."}]}],
            "generationConfig": {"maxOutputTokens": 1500}
          }
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + os.environ["GEMINI_API_KEY"]
          req = urllib.request.Request(url, data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  out = json.loads(r.read().decode())
              text = out["candidates"][0]["content"]["parts"][0]["text"]
          except urllib.error.HTTPError as e:
              body = e.read().decode()[:500]
              print("::error::Gemini API HTTP " + str(e.code) + ": " + body)
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("response<<AIOUT_EOF\n" + text + "\nAIOUT_EOF\n")
          PYEOF

      - name: Pubblica la risposta
        if: ${{ steps.ai.outputs.response != '' }}
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '🤖 **@ai (Gemini, gratis)**\n\n' + process.env.AI_RESPONSE
            });
