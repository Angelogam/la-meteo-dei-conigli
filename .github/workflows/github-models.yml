name: GitHub Models Assistant (gratis)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write
  models: read

jobs:
  ai:
    if: >-
      github.event.sender.type == 'User' &&
      !endsWith(github.event.comment.user.login || github.event.issue.user.login, '[bot]') &&
      contains(github.event.comment.body || github.event.issue.body, '@ai')
    runs-on: ubuntu-latest
    steps:
      - name: Chiedi a GitHub Models
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: gpt-4.1
          system-prompt: >-
            Sei un assistente di sviluppo senior nel repository la-meteo-dei-conigli
            (app meteo per parapendio: Next.js, TypeScript, CesiumJS, cartina 3D, windgram).
            Rispondi sempre in italiano, in modo pratico, concreto e senza giri di parole.
            Se il messaggio è solo il richiamo "@ai" senza una richiesta precisa,
            saluta e chiedi di cosa ha bisogno, proponendo 3 esempi di richieste utili
            per questa app (es. spiegazioni del codice, idee di funzioni, correzioni di bug).
          prompt: |-
            Messaggio dell'utente nella issue #${{ github.event.issue.number }}:
            """
            ${{ github.event.comment.body || github.event.issue.body }}
            """
            Rispondi alla richiesta.

      - name: Pubblica la risposta
        if: ${{ steps.ai.outputs.response != '' }}
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '🤖 **GitHub Models (gratis)**\n\n' + process.env.AI_RESPONSE
            });
