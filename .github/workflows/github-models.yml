name: GitHub Models Assistant (gratis)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write
  models: read

jobs:
  ai:
    if: >-
      github.event.sender.type == 'User' &&
      !endsWith(github.event.comment.user.login || github.event.issue.user.login, '[bot]') &&
      contains(github.event.comment.body || github.event.issue.body, '@ai')
    runs-on: ubuntu-latest
    steps:
      - name: Chiedi a GitHub Models
        id: ai
        env:
          MODELS_TOKEN: ${{ github.token }}
          USER_MSG: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          {
            echo 'response<<AIOUT_EOF'
            python3 - <<'PYEOF'
          import json, os, urllib.request
          msg = os.environ.get("USER_MSG", "")
          num = os.environ.get("ISSUE_NUM", "?")
          payload = {
            "model": "openai/gpt-4.1",
            "messages": [
              {"role": "system", "content": "Sei un assistente di sviluppo senior nel repository la-meteo-dei-conigli (app meteo per parapendio: Next.js, TypeScript, CesiumJS, cartina 3D, windgram). Rispondi sempre in italiano, in modo pratico, concreto e senza giri di parole. Se il messaggio e' solo il richiamo '@ai' senza una richiesta precisa, saluta e chiedi di cosa ha bisogno, proponendo 3 esempi di richieste utili per questa app."},
              {"role": "user", "content": "Messaggio dell'utente nella issue #" + num + ":\n\"\"\"\n" + msg + "\n\"\"\"\nRispondi alla richiesta."}
            ],
            "max_tokens": 1200
          }
          req = urllib.request.Request(
              "https://models.github.ai/inference/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["MODELS_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "la-meteo-ai-assistant",
                  "X-GitHub-Api-Version": "2022-11-28"
              })
          with urllib.request.urlopen(req, timeout=120) as r:
              out = json.loads(r.read().decode())
          print(out["choices"][0]["message"]["content"])
          PYEOF
            echo 'AIOUT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Pubblica la risposta
        if: ${{ steps.ai.outputs.response != '' }}
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '🤖 **GitHub Models (gratis)**\n\n' + process.env.AI_RESPONSE
            });
