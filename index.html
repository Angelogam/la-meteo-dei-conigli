<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Meteo dei Conigli — Previsioni per Volo Libero</title>
    <meta name="description" content="Previsioni aerologiche, termiche e venti in quota per parapendio e deltaplano" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="theme-color" content="#020617" />
    <style>
      /* WINDY CARD - FORCE VISIBLE */
      #windy-soundings-card {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 999999;
        padding: 20px;
        background: #ff6b00;
        color: #000;
        font-family: sans-serif;
        font-size: 16px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 4px solid #000;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      #windy-soundings-card .left { display: flex; align-items: center; gap: 12px; }
      #windy-soundings-card .icon { width: 40px; height: 40px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
      #windy-soundings-card .title { color: #000; margin: 0; font-size: 18px; }
      #windy-soundings-card .subtitle { color: #333; font-size: 11px; margin: 2px 0 0; }
      #windy-soundings-card .values { display: flex; gap: 30px; align-items: center; }
      #windy-soundings-card .val { text-align: center; }
      #windy-soundings-card .val-label { font-size: 10px; color: #666; }
      #windy-soundings-card .val-num { font-size: 24px; font-weight: 900; }
      #windy-soundings-card .val-unit { font-size: 10px; color: #888; }
      #windy-soundings-card .btn { 
        color: #000; 
        text-decoration: none; 
        font-weight: 900; 
        font-size: 12px; 
        padding: 8px 16px; 
        border: 2px solid #000; 
        border-radius: 8px; 
        background: #fff;
      }
    </style>
  </head>
  <body>
    <!-- WINDY PG SOUNDINGS CARD - INJECTED VIA JS FOR MAX VISIBILITY -->
    <script>
      (function() {
        var card = document.createElement('div');
        card.id = 'windy-soundings-card';
        card.innerHTML = '⚡ WINDY PG SOUNDINGS ⚡ CAPE: 120 | 3800m | 22 km/h | <a href="https://windy-plugins.com/2727410/windy-plugin-pg-soundings/1.6.2/plugin.min.js" target="_blank" style="color:black;background:white;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:bold;margin-left:20px;">Plugin Windy</a>';
        card.style.cssText = 'position:fixed !important; top:0 !important; left:0 !important; right:0 !important; width:100% !important; z-index:9999999 !important; background:red !important; color:white !important; padding:20px !important; font-size:18px !important; font-weight:bold !important; text-align:center !important; display:flex !important; align-items:center !important; justify-content:center !important; gap:20px !important; box-sizing:border-box !important;';
        document.body.insertBefore(card, document.body.firstChild);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
