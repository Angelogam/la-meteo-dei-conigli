<?xml version="1.0" encoding="UTF-8"?>
<!-- 
  Icona del coniglio per Meteo dei Conigli
  Per convertire in PNG:
  1. Apri questo file in un browser
  2. Fai screenshot (o usa https://www.pwabuilder.com/imageGenerator)
  3. Salva come ic_launcher.png nelle cartelle mipmap-*
  4. Dimensioni: mdpi=48, hdpi=72, xhdpi=96, xxhdpi=144, xxxhdpi=192
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  
  <!-- Sfondo blu gradiente -->
  <rect width="192" height="192" fill="url(#bg)"/>
  
  <!-- Coniglio stilizzato (semplificato per essere leggibile a piccole dimensioni) -->
  <g transform="translate(96, 100)">
    <!-- Orecchie lunghe -->
    <ellipse cx="-15" cy="-50" rx="8" ry="28" fill="white" stroke="#94A3B8" stroke-width="2" transform="rotate(-12, -15, -50)"/>
    <ellipse cx="15" cy="-50" rx="8" ry="28" fill="white" stroke="#94A3B8" stroke-width="2" transform="rotate(12, 15, -50)"/>
    <ellipse cx="-15" cy="-50" rx="4" ry="20" fill="#FCA5A5" transform="rotate(-12, -15, -50)"/>
    <ellipse cx="15" cy="-50" rx="4" ry="20" fill="#FCA5A5" transform="rotate(12, 15, -50)"/>
    
    <!-- Testa -->
    <circle cx="0" cy="-15" r="28" fill="white" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Corpo -->
    <ellipse cx="0" cy="30" rx="38" ry="32" fill="white" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Occhi -->
    <circle cx="-10" cy="-18" r="4" fill="#0F172A"/>
    <circle cx="10" cy="-18" r="4" fill="#0F172A"/>
    
    <!-- Naso -->
    <ellipse cx="0" cy="-8" rx="3" ry="2" fill="#F472B6"/>
    
    <!-- Guance -->
    <circle cx="-18" cy="-10" r="5" fill="#FCA5A5" opacity="0.6"/>
    <circle cx="18" cy="-10" r="5" fill="#FCA5A5" opacity="0.6"/>
    
    <!-- Piedi -->
    <ellipse cx="-18" cy="58" rx="11" ry="8" fill="white" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="18" cy="58" rx="11" ry="8" fill="white" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Coda -->
    <circle cx="35" cy="20" r="10" fill="white" stroke="#94A3B8" stroke-width="2"/>
  </g>
</svg>
